name: Deploy to Timeweb

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Сломанный JS не уедет на сайт
      - name: Проверка синтаксиса JS
        run: for f in data.js app.js; do node --check "$f"; done

      # Демо на github.io остаётся закрытым от поиска, боевой сайт открываем
      - name: Боевая сборка (без noindex и тестового лендинга)
        run: |
          mkdir -p _out
          cp -r img index.html politika.html style.css app.js data.js robots.txt sitemap.xml .htaccess _out/
          sed -i '/<meta name="robots" content="noindex,nofollow">/d' _out/index.html
          ! grep -q noindex _out/index.html
          sed -i "s#<lastmod>[0-9-]*</lastmod>#<lastmod>$(date +%F)</lastmod>#g" _out/sitemap.xml
          ls -la _out

      # Показывает папки на хостинге в логе (чтобы проверить, куда заливаем)
      - name: Папки на хостинге
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: curl -s --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/" || true

      - name: Заливка сайта на Timeweb (korolprian.ru)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTP Timeweb без шифрования (как у psychopletka, проверено 05.10.2026)
          local-dir: ./_out/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
