<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Королевский Пряник — пряники на заказ в Майкопе</title>
<meta name="description" content="Пряники ручной росписи на заказ в Майкопе: свадебные с датой, с логотипом, наборы к праздникам, домики и мастер-классы для детей.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#"><span class="crown" aria-hidden="true"></span><span data-brand></span></a>
  <a class="btn btn-sm" data-wa-general href="#">Написать</a>
</header>

<main>
  <section class="hero">
    <p class="kicker" data-hero="kicker"></p>
    <h1 data-hero="title"></h1>
    <p class="lead" data-hero="text"></p>
    <a class="btn" href="#works" data-hero="cta"></a>
  </section>

  <section id="works" class="works">
    <h2>Что можно заказать</h2>
    <div class="chips" role="tablist" data-chips></div>
    <div class="occasion-head">
      <p class="occ-lead" data-occ-lead></p>
      <span class="occ-from" data-occ-from></span>
    </div>
    <div class="grid" data-grid></div>
    <button class="btn btn-ghost wide" data-own>Хочу по своей идее</button>
  </section>

  <section class="steps">
    <h2>Как заказать</h2>
    <ol data-steps></ol>
  </section>

  <section class="about">
    <div class="about-photo" aria-hidden="true"></div>
    <div>
      <h2 data-about="title"></h2>
      <p data-about="text"></p>
    </div>
  </section>

  <section class="contacts" id="contacts">
    <h2>Написать мне</h2>
    <div class="contact-btns" data-contacts></div>
    <p class="muted"><span data-city></span> · работаю на заказ</p>
  </section>
</main>

<footer class="foot">
  <span>© <span data-brand></span></span>
  <a href="politika.html">Политика конфиденциальности</a>
</footer>

<!-- Окно «Хочу похожее» -->
<div class="modal" data-modal hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="close" data-close aria-label="Закрыть">×</button>
    <p class="kicker" data-m-occ></p>
    <h3 id="m-title" data-m-title></h3>
    <form data-form>
      <label>Сколько штук
        <input type="number" name="qty" min="1" inputmode="numeric" placeholder="например, 30">
      </label>
      <label>К какой дате
        <input type="date" name="date">
      </label>
      <fieldset>
        <legend>Дизайн</legend>
        <label class="radio"><input type="radio" name="design" value="как на фото" checked> Как на фото, с моей надписью</label>
        <label class="radio"><input type="radio" name="design" value="пришлю свой образец"> Пришлю свой образец</label>
        <label class="radio"><input type="radio" name="design" value="нужен новый дизайн"> Нужен новый дизайн</label>
      </fieldset>
      <label>Надпись или пожелания <span class="muted">(необязательно)</span>
        <textarea name="note" rows="2" placeholder="дата, имена, цвета…"></textarea>
      </label>
      <button class="btn wide" type="submit" data-send-wa>Отправить в WhatsApp</button>
      <div class="alt" data-alt></div>
      <p class="muted small">Сайт ничего не сохраняет: заявка уходит сообщением из вашего мессенджера.</p>
    </form>
  </div>
</div>

<div class="toast" data-toast hidden></div>

<div class="cookie" data-cookie hidden>
  <p>Сайт использует cookie для статистики посещений. <a href="politika.html">Подробнее</a></p>
  <div><button class="btn btn-sm btn-ghost" data-cookie-no>Только необходимые</button><button class="btn btn-sm" data-cookie-yes>Разрешить</button></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
